<div class="modal-overlay animate-fade-in" (click)="onClose()">
  <div class="modal-content glass-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>{{ procedure ? 'Editar Procedimiento' : 'Nuevo Procedimiento Dental' }}</h3>
      <button type="button" class="close-btn" (click)="onClose()"><i class="ri-close-line"></i></button>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-danger">
        <i class="ri-error-warning-line"></i>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="procedureForm" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <div class="form-group full-width">
          <label class="form-label" for="name">Nombre del Procedimiento *</label>
          <input id="name" type="text" class="form-control" placeholder="Ej. Blanqueamiento Dental Led" formControlName="name" />
        </div>

        <div class="form-group full-width">
          <label class="form-label" for="description">Descripción Detallada *</label>
          <textarea id="description" class="form-control" rows="3" placeholder="Descripción del tratamiento odontológico..." formControlName="description"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="price">Precio Base ($ COP) *</label>
          <input id="price" type="number" step="1000" class="form-control" placeholder="150000" formControlName="price" />
        </div>

        <div class="form-group">
          <label class="form-label" for="durationInMinutes">Duración Estimada (Minutos) *</label>
          <input id="durationInMinutes" type="number" step="5" class="form-control" placeholder="45" formControlName="durationInMinutes" />
        </div>
      </div>

      <div class="modal-footer mt-4">
        <button type="button" class="btn btn-secondary" (click)="onClose()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="loading() || procedureForm.invalid">
          @if (loading()) {
            <i class="ri-loader-4-line spinner"></i>
            <span>Guardando...</span>
          } @else {
            <span>{{ procedure ? 'Actualizar Procedimiento' : 'Guardar Procedimiento' }}</span>
          }
        </button>
      </div>
    </form>
  </div>
</div>
