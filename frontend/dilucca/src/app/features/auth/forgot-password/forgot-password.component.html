<div class="auth-page">
  <div class="auth-card glass-card animate-fade-in">
    <div class="brand-header">
      <div class="brand-logo">
        <i class="ri-key-2-line"></i>
      </div>
      <h2>Recuperar Contraseña</h2>
      <p class="subtitle">Ingresa tu correo para recibir un código de 6 dígitos</p>
    </div>

    @if (successMessage()) {
      <div class="alert alert-success animate-fade-in">
        <i class="ri-checkbox-circle-fill"></i>
        <span>{{ successMessage() }}</span>
      </div>
    }

    @if (errorMessage()) {
      <div class="alert alert-danger animate-fade-in">
        <i class="ri-error-warning-fill"></i>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label" for="email">Correo Electrónico Registrado</label>
        <div class="input-icon-wrapper">
          <i class="ri-mail-line input-icon"></i>
          <input
            id="email"
            type="email"
            class="form-control"
            placeholder="ejemplo@dilucca.com"
            formControlName="email"
            [class.is-invalid]="isFieldInvalid('email')"
          />
        </div>
        @if (isFieldInvalid('email')) {
          <span class="field-error">Ingresa un correo válido</span>
        }
      </div>

      <button
        type="submit"
        class="btn btn-primary w-100 mt-3"
        [disabled]="loading() || forgotForm.invalid"
      >
        @if (loading()) {
          <i class="ri-loader-4-line spinner"></i>
          <span>Enviando Código...</span>
        } @else {
          <span>Enviar Código de Verificación</span>
          <i class="ri-send-plane-fill"></i>
        }
      </button>
    </form>

    <div class="auth-footer">
      <a routerLink="/login" class="back-link">
        <i class="ri-arrow-left-line"></i> Volver al Inicio de Sesión
      </a>
    </div>
  </div>
</div>
